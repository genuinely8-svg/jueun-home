<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주은이 게임">
<meta name="theme-color" content="#2b3a2e">
<title>주은이의 행복한 집으로 가는길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: full-bleed landscape canvas; storybook paper cards float over it; joystick left, jump right */
:root{
  --paper:#fbf4e4;
  --ink:#4a3a2c;
  --ink-soft:#7a6650;
  --leaf:#5f9b52;
  --sun:#f2b84b;
  --berry:#e0725c;
  --sky:#cfe6ef;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Gaegu','Jua','Apple SD Gothic Neo',sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#2b3a2e;}
body{font-family:var(--display);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#8fbf6f}
button{font-family:var(--display);cursor:pointer;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
[hidden]{display:none!important}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{pointer-events:auto;background:rgba(251,244,228,.92);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 2px 0 rgba(74,58,44,.25);display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip .stage-name{max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.chip .stars{color:#c98a12;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;pointer-events:auto}
.round{width:42px;height:42px;border-radius:50%;background:rgba(251,244,228,.92);color:var(--ink);font-size:18px;box-shadow:0 2px 0 rgba(74,58,44,.25);display:grid;place-items:center}
.round.off{opacity:.55}
#helpBtn{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);right:calc(env(safe-area-inset-right,0px) + 12px);background:#fff4d6;color:var(--ink);border-radius:18px;padding:8px 14px;font-size:15px;box-shadow:0 3px 0 rgba(74,58,44,.3);display:flex;align-items:center;gap:6px}
#helpBtn .faces{display:flex}
#helpBtn .faces i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid #fff4d6;margin-left:-6px;background:#f6d5b8;position:relative;overflow:hidden}
#helpBtn .faces i::before{content:"";position:absolute;left:-2px;right:-2px;top:-4px;height:11px;border-radius:50% 50% 30% 30%;background:#2e2420}
#helpBtn .faces i:first-child{margin-left:0}
#jumpBtn{pointer-events:auto;position:absolute;right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9a8,#f2b84b 70%);color:#5a3b10;font-size:22px;box-shadow:0 6px 0 #b9832a,0 8px 18px rgba(0,0,0,.25);display:grid;place-items:center;line-height:1}
#jumpBtn{opacity:.42!important;transition:opacity .15s}
#jumpBtn.pressed,#jumpBtn.hint{opacity:.9!important}
#jumpBtn small{display:block;font-size:12px;opacity:.75;margin-top:2px}
#jumpBtn:active,#jumpBtn.pressed{transform:translateY(4px);box-shadow:0 2px 0 #b9832a,0 4px 10px rgba(0,0,0,.2)}
#jumpBtn.hint{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(251,244,228,.28);border:3px solid rgba(251,244,228,.6);pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(251,244,228,.9);box-shadow:0 3px 0 rgba(74,58,44,.25)}
#stickHint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:110px;height:110px;border-radius:50%;border:3px dashed rgba(251,244,228,.55);display:grid;place-items:center;color:rgba(251,244,228,.9);font-size:13px;text-align:center;line-height:1.2}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);background:var(--paper);border-radius:16px;padding:8px 16px;font-family:var(--hand);font-weight:700;font-size:20px;box-shadow:0 3px 0 rgba(74,58,44,.25);max-width:70vw;text-align:center;transition:opacity .3s}
#toast b{font-family:var(--display);font-weight:400;color:var(--berry);margin-right:6px}

/* Cards */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;padding-left:calc(env(safe-area-inset-left,0px) + 16px);padding-right:calc(env(safe-area-inset-right,0px) + 16px);background:rgba(43,58,46,.35);z-index:5}
.overlay.clear{background:transparent}
.card{background:var(--paper);border-radius:26px;padding:22px 26px;max-width:min(560px,92vw);max-height:88vh;overflow:auto;text-align:center;box-shadow:0 6px 0 rgba(74,58,44,.25),0 18px 40px rgba(0,0,0,.25);position:relative}
.card h1{margin:0;font-weight:400;font-size:clamp(26px,5.4vw,40px);line-height:1.15;text-wrap:balance;color:var(--ink)}
.card h2{margin:0 0 4px;font-weight:400;font-size:clamp(22px,4.4vw,30px);text-wrap:balance}
.card p{font-family:var(--hand);font-size:clamp(19px,3.4vw,24px);font-weight:700;color:var(--ink-soft);margin:8px 0 0;line-height:1.3}
.card .eyebrow{font-size:14px;letter-spacing:.08em;color:var(--leaf)}
.card .big-line{font-family:var(--hand);font-weight:700;color:var(--berry);font-size:clamp(24px,4.6vw,34px);line-height:1.25;margin:10px 0 2px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{background:var(--leaf);color:#fff;border-radius:999px;padding:12px 26px;font-size:20px;box-shadow:0 4px 0 #3f6e37}
.btn.alt{background:#efe2c4;color:var(--ink);box-shadow:0 4px 0 #cdb98d}
.btn.warm{background:var(--berry);box-shadow:0 4px 0 #a9493a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f6e37}
#titleScreen{background:transparent;align-items:end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#titleScreen .card{background:rgba(251,244,228,.94)}
.stage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stage-grid button{background:#fff;border-radius:16px;padding:10px 6px;font-size:15px;color:var(--ink);box-shadow:0 3px 0 #d9c9a3;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.stage-grid button .n{font-size:22px;color:var(--leaf)}
.stage-grid button .s{font-size:12px;color:#c98a12;font-variant-numeric:tabular-nums}
.stage-grid button[disabled]{opacity:.4}
.stage-grid button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dialog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(620px,70vw);background:var(--paper);border-radius:22px;padding:14px 20px 16px;box-shadow:0 5px 0 rgba(74,58,44,.25),0 12px 30px rgba(0,0,0,.25);z-index:6;text-align:left}
.dialog .who{display:inline-block;background:var(--berry);color:#fff;border-radius:999px;padding:3px 12px;font-size:15px;margin-bottom:4px}
.dialog .say{font-family:var(--hand);font-weight:700;font-size:clamp(20px,3.6vw,26px);line-height:1.3}
.dialog .btnrow{justify-content:flex-end;margin-top:10px}
#rotate{position:fixed;inset:0;background:#2b3a2e;color:var(--paper);display:none;place-items:center;text-align:center;z-index:20;padding:24px}
#rotate .phone{width:60px;height:100px;border:4px solid var(--paper);border-radius:12px;margin:0 auto 18px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate p{font-size:22px;margin:0}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){#jumpBtn.hint,#rotate .phone{animation:none}}
</style>
</head>
<body>


<canvas id="game" aria-label="주은이의 행복한 집으로 가는길 게임 화면"></canvas>

<div id="hud" hidden>
  <div class="topbar">
    <div class="chip"><span class="stage-name" id="hudStage">1. 학교 끝!</span><span class="stars" id="hudStars">★ 0/5</span></div>
    <div class="tools">
      <button class="round" id="musicBtn" aria-label="음악 켜기/끄기">♪</button>
      <button class="round" id="pauseBtn" aria-label="멈춤">Ⅱ</button>
    </div>
  </div>
  <button id="helpBtn" aria-label="언니 오빠에게 도움 받기"><span class="faces"><i></i><i></i></span>언니·오빠 도와줘!</button>
  <div id="stickHint">여기를 눌러<br>움직여요</div>
  <div id="stick" hidden><i></i></div>
  <button id="jumpBtn" aria-label="점프">점프<small>폴짝!</small></button>
  <div id="toast" style="opacity:0"></div>
</div>

<div class="overlay clear" id="titleScreen">
  <div class="card">
    <div class="eyebrow">주은이만을 위한 게임</div>
    <h1>주은이의 행복한<br>집으로 가는길</h1>
    <p>학교에서 집까지, 반짝반짝 길을 찾아가요</p>
    <div class="btnrow">
      <button class="btn" id="startBtn">시작하기</button>
      <button class="btn alt" id="selectBtn">스테이지 고르기</button>
    </div>
  </div>
</div>

<div class="overlay" id="selectScreen" hidden>
  <div class="card">
    <h2>어디부터 갈까요?</h2>
    <div class="stage-grid" id="stageGrid"></div>
    <div class="btnrow"><button class="btn alt" id="selectBack">돌아가기</button></div>
  </div>
</div>

<div class="overlay" id="storyCard" hidden>
  <div class="card">
    <div class="eyebrow" id="storyEyebrow">스테이지 1</div>
    <h2 id="storyTitle">학교 끝! 집에 가자</h2>
    <div class="big-line" id="storyBig" hidden></div>
    <p id="storyText"></p>
    <div class="btnrow"><button class="btn" id="storyGo">출발!</button></div>
  </div>
</div>

<div class="overlay" id="pauseScreen" hidden>
  <div class="card">
    <h2>잠깐 쉬어요</h2>
    <div class="btnrow">
      <button class="btn" id="resumeBtn">계속하기</button>
      <button class="btn alt" id="pauseSelect">스테이지 고르기</button>
      <button class="btn alt" id="pauseHome">처음 화면</button>
    </div>
  </div>
</div>

<div class="overlay clear" id="endScreen" hidden>
  <div class="card" style="align-self:start;margin-top:4vh">
    <div class="eyebrow">엔딩</div>
    <h2>우리 집에 도착했어요!</h2>
    <div class="big-line">우리 행복이의 오늘 하루는<br>정말 정말 행복했어!</div>
    <p>엄마, 아빠, 지윤 언니, 정운 오빠가 주은이를 꼭 안아줬어요. 사랑해 주은아.</p>
    <div class="btnrow"><button class="btn warm" id="againBtn">처음부터 다시</button></div>
  </div>
</div>

<div class="dialog" id="dialog" hidden>
  <div class="who" id="dlgWho">떡볶이집 아주머니</div>
  <div class="say" id="dlgSay"></div>
  <div class="btnrow" id="dlgBtns"></div>
</div>

<div id="rotate"><div><div class="phone"></div><p>핸드폰을 가로로 돌려주세요</p></div></div>

<script>
(function(){
'use strict';
/* ---------------- basics ---------------- */
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
let DPR=1,VW=0,VH=0,T=56;
const $=id=>document.getElementById(id);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rrect(c,x,y,w,h,r){c.beginPath();if(c.roundRect){c.roundRect(x,y,w,h,r);}else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function ell(c,x,y,rx,ry,col,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2);c.fillStyle=col;c.fill();}

/* ---------------- save ---------------- */
let save={unlocked:1,stars:[0,0,0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem('jueun-home-v1')||'null');if(s&&s.stars)save=s;}catch(e){}
function persist(){try{localStorage.setItem('jueun-home-v1',JSON.stringify(save));}catch(e){}}
let musicOn=true;
try{musicOn=localStorage.getItem('jueun-music')!=='off';}catch(e){}

/* ---------------- stages ---------------- */
const STAGES=[
 {name:'학교 끝! 집에 가자',sub:'수업이 끝났어요. 떡볶이집 앞을 지나 동네 골목을 빠져나가요.',theme:'town',cw:6,ch:4,npc:'ddeok',stars:5,obs:2,seed:1011},
 {name:'멍멍이 공원',sub:'공원 덤불 사이에서 누가 꼬리를 흔들고 있대요.',theme:'park',cw:7,ch:4,npc:'dog',stars:6,obs:3,seed:2027},
 {name:'숲속 오솔길',sub:'나무 그늘 아래 길을 찾아요. 고양이가 낮잠을 자고 있을지도 몰라요.',theme:'forest',cw:8,ch:5,npc:'cat',stars:6,obs:3,seed:3041},
 {name:'반짝 개울',sub:'징검다리 개울은 점프로 폴짝 건너요.',theme:'stream',cw:9,ch:5,npc:null,stars:7,obs:5,seed:4093,big:'우리 행복이의 오늘 하루는<br>얼마나 행복할까?'},
 {name:'노을 언덕',sub:'단풍나무 사이로 해가 노랗게 지고 있어요.',theme:'sunset',cw:10,ch:5,npc:null,stars:7,obs:4,seed:5119},
 {name:'반딧불 숲',sub:'어두워졌지만 괜찮아요. 반딧불이가 길을 밝혀줘요.',theme:'night',cw:10,ch:6,npc:null,stars:8,obs:3,seed:6151},
 {name:'우리 집 골목',sub:'저기 우리 집이 보여요! 가족들이 기다리고 있어요.',theme:'home',cw:9,ch:5,npc:null,stars:7,obs:3,seed:7177,home:true}
];
const THEMES={
 town:{bg:'#b3cf92',path:'#efe5cc',edge:'#d6c6a0',wall:'house',obs:'puddle'},
 park:{bg:'#93c26f',path:'#e8d7a8',edge:'#cbb57f',wall:'hedge',obs:'puddle'},
 forest:{bg:'#73a15d',path:'#dcc897',edge:'#b9a26e',wall:'tree',canopy:['#4f8a4a','#5f9b52','#437d42','#6aa55c'],obs:'log'},
 stream:{bg:'#89b97b',path:'#e6dab2',edge:'#c4b384',wall:'rock',obs:'water'},
 sunset:{bg:'#b0a764',path:'#ecd5a0',edge:'#c9aa6d',wall:'tree',canopy:['#df8f4a','#c8673f','#e8b05a','#b9583c'],obs:'log',tint:'rgba(255,140,70,0.13)'},
 night:{bg:'#3f5e5a',path:'#b3aa92',edge:'#8b826c',wall:'tree',canopy:['#2f5650','#2a4b45','#3a665c','#335d55'],obs:'rock',dark:true},
 home:{bg:'#a0ca82',path:'#f1e6cd',edge:'#d8c5a0',wall:'homeblock',obs:'puddle'}
};

/* ---------------- audio ---------------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master,musicGain,sfxGain,revIn;
function makeImpulse(sec){const len=Math.floor(ac.sampleRate*sec);const b=ac.createBuffer(2,len,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}}return b;}
function initAudio(){
  if(!AC)return;
  try{
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    ac=new AC();
    master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);
    musicGain=ac.createGain();musicGain.gain.value=musicOn?0.55:0;
    const rev=ac.createConvolver();rev.buffer=makeImpulse(2.6);
    const rvG=ac.createGain();rvG.gain.value=0.4;
    revIn=ac.createGain();revIn.gain.value=1;
    musicGain.connect(master);musicGain.connect(rev);rev.connect(rvG);rvG.connect(master);
    sfxGain=ac.createGain();sfxGain.gain.value=0.55;sfxGain.connect(master);
    musicNext=ac.currentTime+0.15;
  }catch(e){ac=null;}
}
function piano(t,midi,dur,vel,dest){
  if(!ac)return;
  const f=440*Math.pow(2,(midi-69)/12);
  const g=ac.createGain();const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200+vel*5000;
  const o1=ac.createOscillator();o1.type='triangle';o1.frequency.value=f;
  const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2.002;
  const g2=ac.createGain();g2.gain.value=0.22;
  const o3=ac.createOscillator();o3.type='sine';o3.frequency.value=f;
  const g3=ac.createGain();g3.gain.value=0.5;
  o1.connect(g);o2.connect(g2);g2.connect(g);o3.connect(g3);g3.connect(g);g.connect(lp);lp.connect(dest);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vel,t+0.006);
  g.gain.exponentialRampToValueAtTime(vel*0.3,t+0.3);
  g.gain.exponentialRampToValueAtTime(0.0005,t+dur+1.3);
  const end=t+dur+1.4;[o1,o2,o3].forEach(o=>{o.start(t);o.stop(end);});
}
/* Original waltz in F major, 3/4 — 16 bars */
const CH=[
 {b:41,n:[53,57,60]},{b:40,n:[55,60,64]},{b:38,n:[53,57,62]},{b:46,n:[53,58,62]},
 {b:45,n:[53,57,60]},{b:43,n:[53,58,62]},{b:48,n:[52,55,58]},{b:41,n:[53,57,60]},
 {b:46,n:[53,58,62]},{b:48,n:[52,55,60]},{b:45,n:[52,57,60]},{b:38,n:[53,57,62]},
 {b:43,n:[55,58,62]},{b:48,n:[52,55,60]},{b:41,n:[53,57,60]},{b:41,n:[53,57,60]}
];
const MEL=[
 [0,69,1.5],[1.5,72,.5],[2,77,1],
 [3,76,2],[5,74,.5],[5.5,72,.5],
 [6,74,1.5],[7.5,77,.5],[8,81,1],
 [9,79,2],[11,77,1],
 [12,77,1],[13,76,.5],[13.5,77,.5],[14,72,1],
 [15,70,1.5],[16.5,74,.5],[17,79,1],
 [18,79,1],[19,77,.5],[19.5,76,.5],[20,74,.5],[20.5,76,.5],
 [21,77,3],
 [24,74,1],[25,77,1],[26,81,1],
 [27,79,1.5],[28.5,76,.5],[29,72,1],
 [30,76,1],[31,72,.5],[31.5,76,.5],[32,81,1],
 [33,77,2],[35,76,.5],[35.5,74,.5],
 [36,74,1.5],[37.5,70,.5],[38,74,1],
 [39,76,1],[40,79,1],[41,76,1],
 [42,77,1.5],[43.5,76,.5],[44,72,1],
 [45,77,3]
];
let musicNext=0,beatIdx=0,tempo=86;
function scheduleMusic(){
  if(!ac||ac.state!=='running')return;
  const spb=60/tempo;
  if(musicNext<ac.currentTime-0.2)musicNext=ac.currentTime+0.05;
  while(musicNext<ac.currentTime+0.5){

let M=null;
function genMaze(cw,ch,r){
  const W=cw*2+1,H=ch*2+1;const g=[];for(let y=0;y<H;y++){g.push(new Array(W).fill(1));}
  const vis=[];for(let y=0;y<ch;y++)vis.push(new Array(cw).fill(false));
  const st=[[0,ch-1]];vis[ch-1][0]=true;g[(ch-1)*2+1][1]=0;
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(st.length){
    const [cx,cy]=st[st.length-1];
    const opts=D.filter(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;return nx>=0&&ny>=0&&nx<cw&&ny<ch&&!vis[ny][nx];});
    if(!opts.length){st.pop();continue;}
    const [dx,dy]=opts[Math.floor(r()*opts.length)];const nx=cx+dx,ny=cy+dy;
    vis[ny][nx]=true;g[cy*2+1+dy][cx*2+1+dx]=0;g[ny*2+1][nx*2+1]=0;st.push([nx,ny]);
  }
  // braid: open some dead ends so there are loops (gentler for a 7 year old)
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
    const tx=x*2+1,ty=y*2+1;const walls=D.filter(([dx,dy])=>g[ty+dy][tx+dx]===1);
    if(walls.length===3&&r()<0.4){const ok=walls.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<cw&&ny<ch;});if(ok.length){const [dx,dy]=ok[Math.floor(r()*ok.length)];g[ty+dy][tx+dx]=0;}}
  }
  return g;
}

  while(qi<q.length){const [x,y]=q[qi++];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const v=g[ny][nx];if(dist[ny][nx]>=0)continue;if(!(v===0||(passObs&&v===2)))continue;dist[ny][nx]=dist[y][x]+1;prev[nx+','+ny]=[x,y];q.push([nx,ny]);}}
  return {dist,prev};
}
function pathTo(prev,sx,sy,gx,gy){const p=[[gx,gy]];let k=gx+','+gy;while(prev[k]){const pr=prev[k];p.push(pr);if(pr[0]===sx&&pr[1]===sy)break;k=pr[0]+','+pr[1];}return p.reverse();}

function buildStage(i){
  const S=STAGES[i],TH=THEMES[S.theme];const r=rng(S.seed);
  const g=genMaze(S.cw,S.ch,r);const H=g.length,W=g[0].length;
  const start={x:1,y:H-2};
  const b=bfs(g,start.x,start.y,true);
  let goal={x:W-2,y:1},best=-1;
  for(let y=1;y<H;y+=2)for(let x=1;x<W;x+=2){const d=b.dist[y][x];if(d>best&&(x>W/2)){best=d;goal={x,y};}}
  const path=pathTo(b.prev,start.x,start.y,goal.x,goal.y);
  const npcs=[];
  if(S.npc){
    const idx=Math.floor(path.length*0.38);
    for(let k=0;k<path.length;k++){const j=idx+(k%2?-1:1)*Math.ceil(k/2);if(j<3||j>path.length-4)continue;const [px,py]=path[j];if(px%2!==1||py%2!==1)continue;
      const cands=[[0,-1],[1,0],[-1,0],[0,1]].map(([dx,dy])=>[px+dx,py+dy]).filter(([wx,wy])=>wx>=1&&wy>=1&&wx<=W-2&&wy<=H-2&&g[wy][wx]===1);
      if(cands.length){const [wx,wy]=cands[0];g[wy][wx]=3;npcs.push({type:S.npc,wx,wy,tx:px,ty:py,met:false,pi:j});break;}}
  }
  // obstacles on the route (jumpable)
  const avoid=new Set();npcs.forEach(n=>{for(let d=-2;d<=2;d++)avoid.add(n.pi+d);});
  const between=[];for(let k=4;k<path.length-3;k++){const [px,py]=path[k];if((px%2)!==(py%2)&&!avoid.has(k))between.push(k);}
  const obs=[];const gap=Math.max(3,Math.floor(between.length/(S.obs+1)));
  for(let n=1;n<=S.obs;n++){const k=between[Math.min(between.length-1,n*gap)];if(k===undefined)continue;const [px,py]=path[k];if(g[py][px]===0&&!obs.some(o=>Math.abs(o.k-k)<3)){g[py][px]=2;obs.push({x:px,y:py,k});}}
  // stars
  const stars=[];const cells=[];for(let y=1;y<H;y+=2)for(let x=1;x<W;x+=2){if(g[y][x]===0&&!(x===start.x&&y===start.y)&&!(x===goal.x&&y===goal.y)&&!npcs.some(n=>n.tx===x&&n.ty===y))cells.push([x,y]);}
  for(let n=0;n<S.stars&&cells.length;n++){const j=Math.floor(r()*cells.length);const [x,y]=cells.splice(j,1)[0];stars.push({x,y,got:false,ph:r()*6});}
  const dg=bfs(g,goal.x,goal.y,true).dist;
  const fireflies=[];if(TH.dark){for(let n=0;n<40;n++)fireflies.push({x:r()*W,y:r()*H,ph:r()*6,sp:0.3+r()*0.5});}
  M={i,S,TH,g,W,H,start,goal,npcs,stars,dg,fireflies,seed:S.seed};
  renderMap();
}

/* ---------------- map prerender ---------------- */
let mapCv=null;
function renderMap(){
  const {g,W,H,TH,S}=M;const s=T*DPR;
  mapCv=document.createElement('canvas');mapCv.width=Math.ceil(W*s);mapCv.height=Math.ceil(H*s);
  const c=mapCv.getContext('2d');const r=rng(M.seed+7);
  c.fillStyle=TH.bg;c.fillRect(0,0,mapCv.width,mapCv.height);
  // painterly ground blotches
  for(let n=0;n<W*H*1.2;n++){c.globalAlpha=0.08+r()*0.08;ell(c,r()*mapCv.width,r()*mapCv.height,s*(0.3+r()*0.9),s*(0.2+r()*0.6),r()<0.5?'#ffffff':'#2f4a2a',r()*3);}
  c.globalAlpha=1;
  // grass tufts
  if(S.theme!=='town'){c.strokeStyle=TH.dark?'rgba(150,200,170,.25)':'rgba(60,100,50,.35)';c.lineWidth=s*0.025;for(let n=0;n<W*H*1.5;n++){const x=r()*mapCv.width,y=r()*mapCv.height;c.beginPath();c.moveTo(x,y);c.lineTo(x-s*0.04,y-s*0.1);c.moveTo(x,y);c.lineTo(x+s*0.04,y-s*0.12);c.stroke();}}
  // path
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=g[y][x];if(v===0||v===2){rrect(c,x*s-s*0.06,y*s-s*0.06,s*1.12,s*1.12,s*0.3);c.fillStyle=TH.edge;c.fill();}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=g[y][x];if(v===0||v===2){rrect(c,x*s+s*0.02,y*s+s*0.02,s*0.96,s*0.96,s*0.26);c.fillStyle=TH.path;c.fill();
    for(let k=0;k<3;k++){c.globalAlpha=0.35;ell(c,x*s+s*(0.15+r()*0.7),y*s+s*(0.15+r()*0.7),s*0.035,s*0.025,TH.edge);}c.globalAlpha=1;
    if(S.theme==='town'&&(x+y)%2===0){c.strokeStyle='rgba(180,160,120,.35)';c.lineWidth=s*0.02;c.strokeRect(x*s+s*0.1,y*s+s*0.1,s*0.8,s*0.8);}
  }}
  // flowers on ground near path
  for(let n=0;n<W*H*0.5;n++){const x=Math.floor(r()*W),y=Math.floor(r()*H);if(g[y][x]!==1)continue;const px=x*s+r()*s,py=y*s+r()*s;const cols=TH.dark?['#cfe0ff','#f3f0c8']:['#fff6f0','#f7c6d2','#ffe08a','#c9b8f0'];ell(c,px,py,s*0.04,s*0.04,cols[Math.floor(r()*cols.length)]);}
  // walls drawn in row order so overhangs overlap nicely
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=g[y][x];
    const cx=x*s+s/2,cy=y*s+s/2;
    if(v===1)drawWall(c,TH,cx,cy,s,r,x,y);
    else if(v===2)drawObstacle(c,TH,cx,cy,s,r,x,y);
    else if(v===3)drawClearing(c,TH,cx,cy,s,r);
  }
  // paper grain
  for(let n=0;n<W*H*30;n++){c.globalAlpha=0.05;c.fillStyle=r()<0.5?'#fff':'#000';c.fillRect(r()*mapCv.width,r()*mapCv.height,DPR,DPR);}
  c.globalAlpha=1;
}
function drawWall(c,TH,cx,cy,s,r,x,y){
  const w=TH.wall;
  if(w==='house'){
    const roofs=['#d7735e','#6d97b8','#86ac6e','#d9a84e','#b98ab8'];
    drawHouse(c,cx,cy+s*0.45,s*0.95,roofs[Math.floor(r()*roofs.length)],r()<0.5?'#fbf1dc':'#f4e2c6',false);
    if(r()<0.4){ell(c,cx+s*0.38,cy+s*0.36,s*0.14,s*0.12,'#6aa55c');}
  }else if(w==='hedge'||(w==='homeblock'&&r()<0.85)){
    const greens=['#5f9b52','#6faa5d','#4f8a4a'];
    for(let k=0;k<5;k++)ell(c,cx+(r()-0.5)*s*0.6,cy+(r()-0.4)*s*0.55,s*(0.26+r()*0.12),s*(0.22+r()*0.1),greens[k%3]);
    c.globalAlpha=0.35;ell(c,cx-s*0.12,cy-s*0.22,s*0.2,s*0.08,'#e8f5c8');c.globalAlpha=1;
    const fl=['#fff6f0','#f7a8b8','#ffd977','#f08a70'];for(let k=0;k<4;k++)ell(c,cx+(r()-0.5)*s*0.7,cy+(r()-0.5)*s*0.6,s*0.05,s*0.05,fl[Math.floor(r()*fl.length)]);
  }else if(w==='homeblock'){
    const roofs=['#d7735e','#6d97b8','#e2a95a'];drawHouse(c,cx,cy+s*0.45,s*0.95,roofs[Math.floor(r()*roofs.length)],'#fbf1dc',false);
    c.fillStyle='#fffaf0';for(let k=0;k<4;k++){rrect(c,cx-s*0.45+k*s*0.25,cy+s*0.25,s*0.08,s*0.22,s*0.03);c.fill();}
  }else if(w==='tree'){
    const cs=TH.canopy;
    rrect(c,cx-s*0.08,cy-s*0.05,s*0.16,s*0.5,s*0.05);c.fillStyle=TH.dark?'#3a2c26':'#7a5a40';c.fill();
    for(let k=0;k<5;k++)ell(c,cx+(r()-0.5)*s*0.55,cy-s*0.2+(r()-0.5)*s*0.5,s*(0.28+r()*0.14),s*(0.25+r()*0.12),cs[k%cs.length]);
    c.globalAlpha=TH.dark?0.15:0.3;ell(c,cx-s*0.15,cy-s*0.38,s*0.2,s*0.1,'#fff8d8',-0.3);c.globalAlpha=1;
  }else if(w==='rock'){
    if(r()<0.5){ell(c,cx,cy+s*0.1,s*0.42,s*0.32,'#a6a39a');ell(c,cx-s*0.08,cy-s*0.02,s*0.3,s*0.2,'#c2bfb4');ell(c,cx+s*0.15,cy+s*0.22,s*0.16,s*0.1,'#8f8c84');}
    else{for(let k=0;k<4;k++)ell(c,cx+(r()-0.5)*s*0.6,cy+(r()-0.4)*s*0.5,s*0.27,s*0.22,['#6faa5d','#5f9b52','#86b874'][k%3]);}
    c.strokeStyle='#4f7f40';c.lineWidth=s*0.03;c.lineCap='round';for(let k=0;k<4;k++){const bx=cx+(r()-0.5)*s*0.8,by=cy+s*0.4;c.beginPath();c.moveTo(bx,by);c.quadraticCurveTo(bx+s*0.05,by-s*0.25,bx+(r()-0.5)*s*0.15,by-s*0.45);c.stroke();}
  }
}
function drawObstacle(c,TH,cx,cy,s,r,x,y){
  const horizCorr=(x%2===0); // corridor runs left-right
  const t=TH.obs;
  if(t==='puddle'){ell(c,cx,cy,s*0.36,s*0.26,'#7fb3d9');ell(c,cx-s*0.08,cy-s*0.06,s*0.16,s*0.06,'rgba(255,255,255,.55)');c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=s*0.02;c.beginPath();c.ellipse(cx+s*0.1,cy+s*0.06,s*0.1,s*0.05,0,0,Math.PI*2);c.stroke();}
  else if(t==='log'){c.save();c.translate(cx,cy);if(horizCorr)c.rotate(Math.PI/2);rrect(c,-s*0.46,-s*0.14,s*0.92,s*0.28,s*0.14);c.fillStyle='#9a6a44';c.fill();ell(c,s*0.42,0,s*0.07,s*0.13,'#d9b48a');c.strokeStyle='#7a4f30';c.lineWidth=s*0.02;c.beginPath();c.moveTo(-s*0.3,-s*0.04);c.lineTo(s*0.2,-s*0.04);c.stroke();ell(c,-s*0.1,-s*0.17,s*0.06,s*0.04,'#6aa55c');c.restore();}
  else if(t==='water'){c.save();c.translate(cx,cy);if(horizCorr)c.rotate(Math.PI/2);rrect(c,-s*0.56,-s*0.32,s*1.12,s*0.64,s*0.2);c.fillStyle='#78b4d6';c.fill();c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=s*0.025;c.lineCap='round';for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(-s*0.4,k*s*0.16);c.quadraticCurveTo(-s*0.2,k*s*0.16-s*0.05,0,k*s*0.16);c.quadraticCurveTo(s*0.2,k*s*0.16+s*0.05,s*0.4,k*s*0.16);c.stroke();}c.restore();}
  else{ell(c,cx,cy+s*0.05,s*0.32,s*0.24,'#8d8a9a');ell(c,cx-s*0.06,cy-s*0.03,s*0.2,s*0.12,'#a9a6b6');}
}
function drawClearing(c,TH,cx,cy,s,r){ell(c,cx,cy+s*0.05,s*0.44,s*0.38,TH.edge);ell(c,cx,cy+s*0.02,s*0.4,s*0.34,TH.path);for(let k=0;k<5;k++)ell(c,cx+(r()-0.5)*s*0.8,cy+(r()-0.5)*s*0.7,s*0.04,s*0.04,['#f7a8b8','#ffd977','#fff6f0'][k%3]);}

/* ---------------- game state ---------------- */
let state='title';
const P={x:1,y:1,fx:1,fy:1,t:1,dur:0.2,jumping:false,face:1,walkPh:0,dir:{x:1,y:0},queued:false};
let trail=[],pets=[],helper=null,parts=[],starCount=0,lastProgress=0,bestDist=1e9,toastTimer=0,blockedAt=0,nowS=0,stageTime=0,endT=0;
function resetPlayer(){P.x=P.fx=M.start.x;P.y=P.fy=M.start.y;P.t=1;P.jumping=false;trail=[];for(let k=0;k<6;k++)trail.push({x:M.start.x,y:M.start.y});}
function setupPets(i){
  pets=[];if(i>=2)pets.push({type:'dog',x:M.start.x,y:M.start.y,ph:0,flip:false});if(i>=3)pets.push({type:'cat',x:M.start.x,y:M.start.y,ph:1,flip:false});
}
function startStage(i){
  buildStage(i);resetPlayer();setupPets(i);helper=null;parts=[];starCount=0;bestDist=M.dg[P.y][P.x];lastProgress=nowS;stageTime=0;
  tempo=M.TH.dark?72:86;
  $('hudStage').textContent=(i+1)+'. '+M.S.name;updateStars();
  showStory(i);
}
function updateStars(){$('hudStars').textContent='★ '+starCount+'/'+M.stars.length;}
function showStory(i){
  const S=STAGES[i];state='card';
  $('storyEyebrow').textContent='스테이지 '+(i+1)+' / '+STAGES.length;
  $('storyTitle').textContent=S.name;
  const big=$('storyBig');if(S.big){big.innerHTML=S.big;big.hidden=false;}else big.hidden=true;
  $('storyText').textContent=S.sub;$('storyGo').textContent='출발!';
  $('storyGo').onclick=()=>{SFX.tap();$('storyCard').hidden=true;state='play';$('hud').hidden=false;lastProgress=nowS;};
  $('storyCard').hidden=false;$('hud').hidden=true;
}
function walkable(x,y){return M&&x>=0&&y>=0&&x<M.W&&y<M.H&&M.g[y][x]===0;}
function tile(x,y){return (x>=0&&y>=0&&x<M.W&&y<M.H)?M.g[y][x]:1;}
function beginMove(nx,ny,dur,jump){
  trail.push({x:P.x,y:P.y});if(Math.abs(nx-P.x)+Math.abs(ny-P.y)===2)trail.push({x:(nx+P.x)/2,y:(ny+P.y)/2});if(trail.length>40)trail.splice(0,trail.length-40);
  P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.t=0;P.dur=dur;P.jumping=!!jump;if(nx!==P.fx)P.face=nx>P.fx?1:-1;
}
function tryMove(d){
  const nx=P.x+d.x,ny=P.y+d.y;P.dir=d;
  if(walkable(nx,ny)){beginMove(nx,ny,0.2,false);return true;}
  if(tile(nx,ny)===2){if(nowS-blockedAt>1.2){blockedAt=nowS;SFX.bump();toast('','점프 버튼을 눌러서 폴짝 넘어가요!');$('jumpBtn').classList.add('hint');setTimeout(()=>$('jumpBtn').classList.remove('hint'),2200);}return false;}
  if(nx!==P.x)P.face=nx>P.x?1:-1;
  return false;
}
function doJump(){
  if(state!=='play')return;
  $('jumpBtn').classList.remove('hint');
  if(P.t<1){P.queued=true;return;}
  const d=inputDir()||P.dir;
  const ax=P.x+d.x,ay=P.y+d.y;
  if(tile(ax,ay)===2&&walkable(ax+d.x,ay+d.y)){beginMove(ax+d.x,ay+d.y,0.5,true);}
  else if(walkable(ax,ay)&&inputDir()){beginMove(ax,ay,0.36,true);}
  else{P.fx=P.x;P.fy=P.y;P.t=0;P.dur=0.38;P.jumping=true;}
  SFX.jump();
  burst(P.fx+0.5,P.fy+0.9,5,'#ffffff',0.6);
}
function arrive(){
  if(P.jumping)SFX.land();else if(Math.random()<0.6)SFX.step();
  P.jumping=false;
  M.stars.forEach(s=>{if(!s.got&&s.x===P.x&&s.y===P.y){s.got=true;starCount++;updateStars();SFX.star();burst(s.x+0.5,s.y+0.5,12,'#ffd23f',1);}});
  const d=M.dg[P.y][P.x];if(d>=0&&d<bestDist){bestDist=d;lastProgress=nowS;}
  for(const n of M.npcs){if(!n.met&&n.tx===P.x&&n.ty===P.y){n.met=true;meetNpc(n);return;}}
  if(P.x===M.goal.x&&P.y===M.goal.y)stageClear();
}

function stageClear(){

});
cv.addEventListener('pointermove',e=>{if(stick&&e.pointerId===stick.id){let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const m=Math.hypot(dx,dy),R=50;if(m>R){dx*=R/m;dy*=R/m;}stick.dx=dx/R;stick.dy=dy/R;$('stick').firstElementChild.style.transform='translate('+dx+'px,'+dy+'px)';}});
function endStick(e){if(stick&&e.pointerId===stick.id){stick=null;$('stick').hidden=true;$('stick').firstElementChild.style.transform='';}}

function inputDirs(){
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;
  if(stick){dx+=stick.dx;dy+=stick.dy;}
  const ax=Math.abs(dx),ay=Math.abs(dy);if(Math.max(ax,ay)<0.35)return null;
  const p=ax>=ay?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};
  const sec=ax>=ay?(ay>0.3?{x:0,y:Math.sign(dy)}:null):(ax>0.3?{x:Math.sign(dx),y:0}:null);
  return {p,sec};
}
function inputDir(){const d=inputDirs();return d?d.p:null;}

/* ---------------- update ---------------- */
function update(dt){
  nowS+=dt;
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.heart?-0.2:2.2)*dt;p.life-=dt;});parts=parts.filter(p=>p.life>0);
  if(state==='ending'){endT+=dt;return;}
  if(!M||state!=='play')return;
  stageTime+=dt;
  if(P.t<1){P.t=Math.min(1,P.t+dt/P.dur);P.walkPh+=dt*14;if(P.t>=1)arrive();}
  if(P.t>=1&&state==='play'){
    if(P.queued){P.queued=false;doJump();}
    else{const d=inputDirs();if(d){if(!tryMove(d.p)&&d.sec)tryMove(d.sec);}}
  }
  // pets follow trail
  pets.forEach((pt,k)=>{const tg=trail[Math.max(0,trail.length-1-k)]||{x:P.x,y:P.y};const ox=pt.x;pt.x=lerp(pt.x,tg.x,Math.min(1,dt*6));pt.y=lerp(pt.y,tg.y,Math.min(1,dt*6));const mv=Math.hypot(tg.x-pt.x,tg.y-pt.y);pt.moving=mv>0.05;if(pt.moving)pt.ph+=dt*5;if(Math.abs(pt.x-ox)>0.002)pt.flip=pt.x<ox;});
  if(helper){helper.t+=dt;const tx=P.x-0.9,ty=P.y-0.15;helper.x=lerp(helper.x,tx,Math.min(1,dt*3));helper.y=lerp(helper.y,ty,Math.min(1,dt*3));if(helper.t>helper.life)helper=null;}
  if(!helper&&nowS-lastProgress>22)callHelper(true);
  if(M.TH.dark)M.fireflies.forEach(f=>{f.ph+=dt*f.sp;f.x+=Math.cos(f.ph*1.3)*dt*0.3;f.y+=Math.sin(f.ph)*dt*0.25;});
}

}

  for(let k=0;k<9;k++){const tx=(k/9+0.03)*w,ty=h*0.66+Math.sin(k*1.7)*h*0.03;const cs=mode==='end'?['#d9894a','#c8673f']:['#5f9b52','#4f8a4a'];ell(c,tx,ty,h*0.04,h*0.055,cs[k%2]);}
  // path
  c.fillStyle=mode==='end'?'#ecd5a0':'#efe2bf';c.beginPath();c.moveTo(-w*0.1,h);c.quadraticCurveTo(w*0.45,h*0.78,w*0.72,h*0.74);c.lineTo(w*0.76,h*0.76);c.quadraticCurveTo(w*0.5,h*0.86,w*0.25,h);c.closePath();c.fill();
  drawHouse(c,w*0.8,h*0.77,h*0.26,'#d7735e','#fff4e0',mode==='end');
  // flowers
  const r=rng(42);for(let k=0;k<60;k++){const fx=r()*w,fy=h*(0.78+r()*0.22);ell(c,fx,fy,h*0.006,h*0.006,['#fff6f0','#f7a8b8','#ffd977'][k%3]);}
}
function drawTitle(t){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);drawScenery(c,VW,VH,t,'title');
  const base=VH*0.82,hh=VH*0.26;
  drawDog(c,VW*0.2,base+VH*0.04,hh*0.55,t*1.5,false,false);
  c.save();c.translate(VW*0.3,base-Math.abs(Math.sin(t*3))*VH*0.02);drawPerson(c,0,0,hh,Object.assign({},LOOK.jueun,{wave:t*7}),0);c.restore();
  drawCat(c,VW*0.39,base+VH*0.05,hh*0.5,t,true,true);
  for(let k=0;k<5;k++){const a=t*0.6+k*1.3;drawStar(c,VW*(0.15+k*0.17),VH*(0.18+0.04*Math.sin(a)),VH*0.012,'rgba(255,214,90,.8)');}
}
const FAMILY=[{k:'dad',h:1,label:'아빠'},{k:'jeongun',h:0.98,label:'정운 오빠'},{k:'jueun',h:0.6,label:'주은',kid:true},{k:'jiyun',h:0.9,label:'지윤 언니'},{k:'mom',h:0.92,label:'엄마'}];
function drawEnding(t){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);drawScenery(c,VW,VH,t,'end');
  const H0=VH*0.42;const gap=VW*0.105;const walk=Math.min(1,t/3.6);const ease=1-Math.pow(1-walk,3);
  const centerX=lerp(-VW*0.25,VW*0.45,ease);const base=VH*0.93;
  const pos=FAMILY.map((f,i)=>({x:centerX+(i-2)*gap,y:base,h:H0*f.h}));
  const ph=walk<1?t*7:0;
  const geo=pos.map((p,i)=>personGeom(p.x,p.y,p.h,LOOK[FAMILY[i].k]));
  const hands=[];for(let i=0;i<pos.length-1;i++){const a=geo[i].sr,b=geo[i+1].sl;hands.push({x:(a.x+b.x)/2,y:Math.max(a.y,b.y)+H0*0.14});}
  // pets
  drawDog(c,centerX-gap*2.7,base,H0*0.32,t*2,false,walk>=1);
  drawCat(c,centerX+gap*2.6,base,H0*0.3,t*2,false,walk>=1);
  pos.forEach((p,i)=>{const o=Object.assign({},LOOK[FAMILY[i].k],{open:walk>=1&&i===2});if(i>0)o.handL=hands[i-1];if(i<pos.length-1)o.handR=hands[i];
    const bob=walk<1?Math.abs(Math.sin(ph+i))*VH*0.006:(i===2?Math.abs(Math.sin(t*4))*VH*0.02:0);
    drawPerson(c,p.x,p.y-bob,p.h,o,walk<1?ph+i*0.7:0);
    c.fillStyle='#4a3a2c';c.font=Math.round(VH*0.035)+'px Jua, sans-serif';c.textAlign='center';c.textBaseline='alphabetic';c.fillText(FAMILY[i].label,p.x,Math.min(VH-4,p.y+VH*0.05));});
  if(walk>=1){
    for(let n=0;n<8;n++){const a=(t*0.4+n/8)%1;drawHeart(c,centerX+(n-3.5)*gap*0.55+Math.sin(t+n)*10,base-H0*1.1-a*VH*0.35,VH*0.03*(1-a*0.4),'rgba(240,122,138,'+(1-a).toFixed(2)+')');}}
}

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);
  try{
    if(state==='title'||state==='select')drawTitle(nowS);
    else if(state==='ending')drawEnding(endT);
    else if(M)drawGame();
  }catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){document.fonts.load('20px Jua').catch(()=>{});document.fonts.load('20px Gaegu').catch(()=>{});}
requestAnimationFrame(frame);
})();
</script>
